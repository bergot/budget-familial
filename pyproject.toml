[project]
name = "budget-familial"
version = "0.1.0"
description = "Application de gestion de budget familial (comptes, rapprochement, échéances, budget)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "platformdirs>=4.14.4",
    "pyside6-essentials>=6.12.0",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
budget-familial = "budget.__main__:main"

[tool.uv.build-backend]
module-name = "budget"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
