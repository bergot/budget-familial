# Utilisé uniquement en développement, pour créer de nouvelles migrations :
#   uv run alembic upgrade head                                  (met à jour dev.sqlite)
#   uv run alembic revision --autogenerate -m "description"      (détecte les changements)
# L'application, elle, applique les migrations toute seule au démarrage.

[alembic]
script_location = src/budget/db/migrations
sqlalchemy.url = sqlite:///dev.sqlite
