name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      # Bibliothèques système nécessaires à Qt sous Linux (même sans écran).
      - name: Dépendances système Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0

      - name: Installation (Python 3.14 lu dans .python-version)
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy

      - name: Tests
        run: uv run pytest

  package:
    name: Exécutable (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7

      - name: Dépendances système Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0

      - run: uv sync

      - name: Construction avec PyInstaller
        run: uv run pyinstaller --noconfirm budget-familial.spec

      # Lance l'exécutable construit : il doit démarrer, créer sa base et trouver son icône.
      # C'est le seul endroit où l'on vérifie le build Windows pour de vrai.
      - name: Test de fumée de l'exécutable
        run: uv run python packaging/smoke_test.py dist/budget-familial

      - name: Archive de distribution
        run: uv run python packaging/make_archive.py dist/budget-familial

      - uses: actions/upload-artifact@v6
        with:
          name: budget-familial-${{ runner.os }}
          path: |
            dist/budget-familial-*.zip
            dist/budget-familial-*.tar.gz
          if-no-files-found: error
